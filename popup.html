<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Blocked sites</title>
  <link rel="stylesheet" href="ui.css">
  <script src="shared.js" defer></script>
  <script src="sites.js" defer></script>
</head>
<body class="popup-page">
  <main class="popup">
    <header class="popup-header">
      <h1>Blocked sites</h1>
      <label class="switch" title="Turn blocking on or off">
        <input id="enabled" type="checkbox" aria-label="Blocking on or off">
        <span class="switch-track"></span>
      </label>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <input id="rule-input" type="text" placeholder="example.com/1" spellcheck="false" autocomplete="off" aria-label="Website prefix to block">
      <button type="submit">Add</button>
    </form>
    <p id="message" class="message" role="status" hidden></p>

    <ul id="rule-list" class="rule-list"></ul>
    <p id="empty-note" class="empty-note">Nothing is blocked yet. Add a prefix like <code>example.com/1</code>.</p>

    <footer class="popup-footer"><button id="open-options" class="link-button" type="button">Open the full list</button></footer>
  </main>
</body>
</html>
